name = "ktgh-poster-gen"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "b93c8b9df0a6817ac9fbab7e920eb6f2"
workers_dev = true

# 共用範本與寫入限速存放處
[[kv_namespaces]]
binding = "RL"
id = "382a642d6f854b87b485e5ab9a8ece7e"

[vars]
# 允許呼叫的來源（逗號分隔）。本機預覽 localhost 也放行。
ALLOWED_ORIGINS = "https://kyoape-ux.github.io,http://localhost:3464,http://127.0.0.1:3464"
# 共用範本寫入金鑰：秘密 ADMIN_TOKEN 用 `wrangler secret put ADMIN_TOKEN` 設定（不要寫在這裡；重設用專案根目錄 setup-admin-token.sh）
