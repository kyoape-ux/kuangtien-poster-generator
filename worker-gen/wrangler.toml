[vars]
# 允許呼叫的來源（逗號分隔）。本機預覽 localhost 也放行。
ALLOWED_ORIGINS = "https://kyoape-ux.github.io,http://localhost:3464,http://127.0.0.1:3464"
# 每 IP 限制：每分鐘 / 每日
