name = "ktgh-poster-gen"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "b93c8b9df0a6817ac9fbab7e920eb6f2"
workers_dev = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "RL"
id = "382a642d6f854b87b485e5ab9a8ece7e"

[vars]
# 允許呼叫的來源（逗號分隔）。本機預覽 localhost 也放行。
ALLOWED_ORIGINS = "https://kyoape-ux.github.io,https://ktgh-poster.ktghvideo.workers.dev,http://localhost:3464,http://127.0.0.1:3464"
# 每 IP 限制：每分鐘 / 每日
LIMIT_PER_MIN = "4"
LIMIT_PER_DAY = "40"
# 全站每日上限（免費額度約 170 張/天，留餘裕）
LIMIT_GLOBAL_DAY = "150"
# Nano Banana（Gemini 影像 API，付費）每人／全院每日張數上限；金鑰用 `wrangler secret put GEMINI_API_KEY` 設定
BANANA_PER_DAY = "8"
BANANA_GLOBAL_DAY = "60"
GEMINI_IMAGE_MODEL = "gemini-3.1-flash-image"
# 共用範本寫入：秘密 ADMIN_TOKEN 用 `wrangler secret put ADMIN_TOKEN` 設定（不要寫在這裡）
